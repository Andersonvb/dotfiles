# ============================================================
# Terminal / Colors
# ============================================================

# Enable 256-color support and true color
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",*256col*:Tc"
set -ga terminal-overrides ",alacritty:Tc"


# ============================================================
# Mouse
# ============================================================

# Enable mouse support for panes, windows, scrolling and selection
set -g mouse on


# ============================================================
# Status bar
# ============================================================

# Status bar at bottom
set -g status-position bottom

# Status bar colors
set -g status-bg black
set -g status-fg white

# Optional hostname/date/time
# set -g status-right "#H | %Y-%m-%d %H:%M"


# ============================================================
# Pane management
# ============================================================

# Split panes with | and -
bind | split-window -h
bind - split-window -v

# Move between panes with Alt + Arrow
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D


# ============================================================
# Window names
# ============================================================

setw -g automatic-rename on
setw -g automatic-rename-format "#{b:pane_current_command}"


# ============================================================
# History
# ============================================================

set -g history-limit 10000


# ============================================================
# Copy mode / Clipboard
# ============================================================

# Use vi keys in copy mode
setw -g mode-keys vi

# Enable tmux clipboard integration
set -g set-clipboard on

# Keep Wayland/X11 environment updated when attaching to tmux
set -g update-environment "DISPLAY WAYLAND_DISPLAY XAUTHORITY XDG_RUNTIME_DIR"

# Copy selection to GNOME Wayland clipboard with y
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'wl-copy'

# Copy selection to GNOME Wayland clipboard with Enter
bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel 'wl-copy'

# Copy mouse selection automatically to Wayland clipboard
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel 'wl-copy'
bind -T copy-mode MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel 'wl-copy'
